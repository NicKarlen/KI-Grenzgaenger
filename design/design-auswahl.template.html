<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design-Auswahl · KI-Grenzgänger</title>
<style>
/* ============================================================
   Basis – Farben im Stil von claude.ai
   ============================================================ */
:root{
  --bg:#faf9f5;--bg-2:#f0eee6;--bg-3:#e8e5da;--surface:#fff;
  --border:#e6e2d6;--border-strong:#d4cfc0;
  --text:#141413;--text-2:#4d4c48;--text-3:#83827d;
  --accent:#c96442;--accent-hover:#b4552f;--accent-soft:#f6e8e1;--accent-text:#9c4527;
  --gruen:#2f8a57;--gruen-soft:#e3f1e8;--gelb:#b8820e;--gelb-soft:#f8efd6;
  --orange:#d16a1e;--orange-soft:#fbe6d5;--rot:#c0392b;--rot-soft:#f7e0dc;
  --grau:#9a978d;--grau-soft:#eceae3;--blau:#4a6fa5;--blau-soft:#e4ebf5;
  --serif:"Tiempos Headline","Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,ui-serif,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 1px 2px rgba(20,20,19,.04),0 2px 8px rgba(20,20,19,.04);
  --shadow-lg:0 4px 10px rgba(20,20,19,.05),0 18px 40px rgba(20,20,19,.10);
  --sw:44px; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#262624;--bg-2:#1f1e1d;--bg-3:#353431;--surface:#30302e;
  --border:#3e3d39;--border-strong:#55534d;
  --text:#f5f4ef;--text-2:#c9c7bd;--text-3:#9b998f;
  --accent:#d97757;--accent-hover:#e48a6b;--accent-soft:#43312a;--accent-text:#eda189;
  --gruen:#5cba84;--gruen-soft:#2a3a30;--gelb:#e0b54a;--gelb-soft:#3d3626;
  --orange:#ec9050;--orange-soft:#42322a;--rot:#e46b5d;--rot-soft:#432b28;
  --grau:#a5a298;--grau-soft:#3a3936;--blau:#86a6d6;--blau-soft:#2d3442;
  --shadow:0 1px 2px rgba(0,0,0,.25);--shadow-lg:0 12px 36px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent-text);text-underline-offset:3px}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;line-height:1.2;margin:0 0 .5em}
p{margin:0 0 1em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--text-3)}.klein{font-size:.85rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg{flex:none}

/* ---------- Umschalter (nur für die Auswahl) ---------- */
.switcher{position:sticky;top:0;z-index:100;background:#141413;color:#f5f4ef;font-size:.85rem;height:var(--sw)}
.switcher-in{max-width:1320px;height:100%;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:.75rem}
.switcher strong{font-weight:600;white-space:nowrap}
.sw-tabs{display:flex;gap:.25rem;background:#2a2a28;padding:3px;border-radius:10px}
.sw-tabs button{background:none;border:0;color:#c9c7bd;padding:.3rem .8rem;border-radius:8px;cursor:pointer;white-space:nowrap}
.sw-tabs button[aria-pressed="true"]{background:#d97757;color:#fff}
.sw-desc{color:#9b998f;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw-theme{background:#2a2a28;border:0;color:#f5f4ef;border-radius:8px;padding:.3rem .7rem;cursor:pointer;white-space:nowrap}

/* ---------- Bausteine ---------- */
.brand{display:inline-flex;align-items:center;gap:.55rem;font-family:var(--serif);font-size:1.15rem;color:var(--text);text-decoration:none;white-space:nowrap}
.brand-m{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff}
.brand b{font-weight:500;color:var(--accent)}
.amp{display:inline-flex;align-items:center;gap:.45rem;font-size:.85rem;color:var(--text-2);white-space:nowrap}
.amp i{width:10px;height:10px;border-radius:50%;flex:none;background:var(--grau);box-shadow:0 0 0 3px var(--grau-soft)}
.amp-gruen i{background:var(--gruen);box-shadow:0 0 0 3px var(--gruen-soft)}
.amp-gelb i{background:var(--gelb);box-shadow:0 0 0 3px var(--gelb-soft)}
.amp-orange i{background:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.amp-rot i{background:var(--rot);box-shadow:0 0 0 3px var(--rot-soft)}
.amp-abh i{background:transparent;border:2px solid var(--gruen);box-shadow:none}
.amp em{font-style:normal;color:var(--text-3)}
.ort{display:inline-flex;align-items:center;gap:.4rem;font-size:.84rem;font-weight:500;padding:.22rem .6rem;border-radius:8px;white-space:nowrap}
.ort-ch,.ort-eu{background:var(--gruen-soft);color:var(--gruen)}
.ort-eub{background:var(--gelb-soft);color:var(--gelb)}
.ort-unklar{background:var(--grau-soft);color:var(--text-2)}
.ort-us,.ort-cn{background:var(--rot-soft);color:var(--rot)}
.reg{font:600 .66rem var(--sans);letter-spacing:.04em;padding:.1rem .38rem;border-radius:5px;background:var(--bg-2);color:var(--text-2);border:1px solid var(--border)}
.chip{display:inline-flex;align-items:center;gap:.3rem;font:500 .74rem var(--sans);padding:.16rem .55rem;border-radius:999px;white-space:nowrap}
.chip-v{background:var(--blau-soft);color:var(--blau)}
.chip-o{background:var(--grau-soft);color:var(--text-2)}
.chip-f{background:var(--bg-2);color:var(--text-2);border:1px solid var(--border)}
.chip-f svg{width:13px;height:13px;color:var(--text-3)}
.kat{display:inline-flex;align-items:center;gap:.45rem;font-weight:600;font-size:.82rem;color:var(--accent-text)}
.kat .ki{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent-text)}
.kat .ki svg{width:15px;height:15px}
.kann{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.kann>span.l{font-size:.74rem;color:var(--text-3);margin-right:.1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-weight:500;font-size:.92rem;padding:.55rem 1rem;border-radius:10px;border:1px solid transparent;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:var(--accent-hover)}
.btn-g{background:var(--surface);border-color:var(--border-strong);color:var(--text)}.btn-g:hover{background:var(--bg-2)}
.btn-t{background:none;color:var(--text-2);padding:.4rem .6rem}.btn-t:hover{background:var(--bg-2);color:var(--text)}
.seg{display:inline-flex;background:var(--bg-2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:.38rem .8rem;border-radius:8px;cursor:pointer;font-size:.88rem;color:var(--text-2);white-space:nowrap;display:inline-flex;align-items:center;gap:.35rem}
.seg button svg{width:15px;height:15px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:500}

/* ---------- Detail (gemeinsam) ---------- */
.det{max-width:760px}
.det h1{font-size:clamp(1.7rem,4vw,2.35rem);margin:.5rem 0 .15rem}
.det-anb{color:var(--text-3);margin-bottom:.9rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.det-was{background:var(--bg-2);border-radius:14px;padding:.9rem 1.1rem;display:grid;gap:.6rem}
.det-was p{margin:0;color:var(--text-2);font-size:.95rem}
.det section{margin-top:1.4rem}
.det h2{font-size:1.18rem}
.det-kurz{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1.35rem;box-shadow:var(--shadow)}
.det-kurz ul{list-style:none;margin:0 0 1rem;padding:0;display:flex;flex-direction:column;gap:.7rem}
.det-kurz li{display:flex;gap:.7rem;align-items:flex-start;font-family:var(--serif);font-size:1.05rem;line-height:1.45}
.ti{flex:none;display:grid;place-items:center;width:23px;height:23px;border-radius:50%;font:700 .78rem var(--sans);margin-top:.08rem}
.ton-gut .ti{background:var(--gruen-soft);color:var(--gruen)}
.ton-mittel .ti{background:var(--gelb-soft);color:var(--gelb)}
.ton-schlecht .ti{background:var(--rot-soft);color:var(--rot)}
.ton-offen .ti{background:var(--grau-soft);color:var(--text-2)}
.det-amps{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;padding-top:1rem;border-top:1px solid var(--border)}
.det-achtung{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:14px;padding:1rem 1.25rem}
.det-achtung h2{color:var(--accent-text);font-size:1.05rem;margin-bottom:.3rem}
.det-achtung p{margin:0}
.det-fakten{display:grid;grid-template-columns:repeat(2,1fr);gap:.65rem}
.fk{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.8rem .95rem}
.fk span{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:600;margin-bottom:.15rem}
.fk b{font-weight:400;font-size:.92rem}
.fk.offen b{color:var(--text-3);font-style:italic}
.det-vischer{background:var(--blau-soft);border-radius:14px;padding:1rem 1.25rem}
.det-vischer h2{color:var(--blau);font-size:1.05rem;margin-bottom:.3rem}
.det-vischer p:last-child{margin:0}
.acc{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:.5rem;overflow:hidden}
.acc summary{cursor:pointer;padding:.85rem 1.1rem;font-weight:500;display:flex;align-items:center;gap:.6rem;list-style:none}
.acc summary::-webkit-details-marker{display:none}
.acc summary>span:first-child{flex:1}
.acc summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--text-3);border-bottom:2px solid var(--text-3);transform:rotate(45deg);transition:transform .2s}
.acc[open] summary::after{transform:rotate(-135deg)}
.acc summary:hover{background:var(--bg)}
.acc dl{margin:0;padding:0 1.1rem .5rem}
.acc .row{display:grid;grid-template-columns:38% 1fr;gap:1rem;padding:.7rem 0;border-top:1px solid var(--border)}
.acc dt{font-weight:500;font-size:.88rem}
.acc dt small{display:block;font-weight:400;color:var(--text-3);font-size:.78rem;line-height:1.4;margin-top:.1rem}
.acc dd{margin:0;font-size:.9rem;overflow-wrap:anywhere}
.acc ul.q{list-style:none;margin:0;padding:0 1.1rem .8rem}
.acc ul.q li{padding:.45rem 0;border-top:1px solid var(--border);font-size:.88rem}
.acc ul.q small{display:block;color:var(--text-3);font-size:.72rem;overflow-wrap:anywhere}

/* ---------- Schublade (C + D) ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,20,19,.38);z-index:110;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:111;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-hd{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.7rem 1.1rem;border-bottom:1px solid var(--border);background:var(--surface)}
.dr-bd{overflow-y:auto;padding:1.25rem 1.5rem 3rem}

/* ============================================================
   B – Berater
   ============================================================ */
.vb{min-height:calc(100vh - var(--sw));display:flex;flex-direction:column}
.vb-top{display:flex;align-items:center;justify-content:space-between;padding:.75rem 20px;max-width:1240px;margin:0 auto;width:100%}
.vb-main{flex:1;width:100%;max-width:800px;margin:0 auto;padding:1rem 20px 10rem}
.vb-welcome{text-align:center;padding:3rem 0 .5rem}
.vb-welcome .logo{width:52px;height:52px;border-radius:15px;background:var(--accent);color:#fff;display:inline-grid;place-items:center;margin-bottom:1.1rem}
.vb-welcome h1{font-size:clamp(1.9rem,4.5vw,2.6rem);margin-bottom:.4rem}
.vb-welcome p{color:var(--text-2);font-size:1.08rem;max-width:540px;margin:0 auto}
.vb-trust{display:flex;justify-content:center;gap:1.25rem;flex-wrap:wrap;margin-top:1rem;font-size:.82rem;color:var(--text-3)}
.vb-trust span{display:inline-flex;align-items:center;gap:.35rem}
.vb-trust svg{width:15px;height:15px;color:var(--gruen)}
.msg{display:flex;gap:.85rem;margin:1.6rem 0}
.msg.neu{animation:auf .35s ease both}
@keyframes auf{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg .av{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;margin-top:.1rem}
.msg .bd{flex:1;min-width:0}
.msg .tx{font-family:var(--serif);font-size:1.13rem;line-height:1.55}
.msg .tx small{display:block;font-family:var(--sans);font-size:.85rem;color:var(--text-3);margin-top:.2rem}
.prog{display:flex;align-items:center;gap:.35rem;font:500 .72rem var(--sans);color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem}
.prog i{width:18px;height:4px;border-radius:2px;background:var(--bg-3)}
.prog i.on{background:var(--accent)}
.msg.user{justify-content:flex-end}
.msg.user .bub{display:inline-flex;align-items:center;gap:.45rem;background:var(--bg-3);border-radius:18px 18px 4px 18px;padding:.55rem .95rem;max-width:85%;cursor:pointer;border:0;text-align:left;font-size:.97rem}
.msg.user .bub svg{width:16px;height:16px;color:var(--accent-text)}
.msg.user .bub small{font-size:.72rem;color:var(--text-3);margin-left:.35rem}
.msg.user .bub:hover small{color:var(--accent-text)}
.vb-opts{display:grid;gap:.5rem;margin-top:.9rem}
.vb-opts.g2{grid-template-columns:repeat(2,1fr)}
.vb-opts button{display:flex;align-items:center;gap:.85rem;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:.85rem 1rem;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.vb-opts button:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.vb-opts .ic{flex:none;width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.vb-opts .tt{flex:1;min-width:0}
.vb-opts strong{display:block;font-weight:600;font-size:.96rem;line-height:1.3}
.vb-opts small{color:var(--text-3);font-size:.82rem;line-height:1.35;display:block;margin-top:.1rem}
.vb-opts .n{font-size:.75rem;color:var(--text-3);white-space:nowrap}
.vb-recs{display:grid;gap:1rem;margin-top:1rem}
.vb-rec{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.vb-rec .top{padding:1.15rem 1.3rem 1rem;display:grid;gap:.6rem}
.vb-rec .hd{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.vb-rec .rank{display:inline-flex;align-items:center;gap:.35rem;font:600 .72rem var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin-left:auto}
.vb-rec .rank b{width:22px;height:22px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:.75rem}
.vb-rec h3{font-size:1.32rem;margin:0}
.vb-rec .an{font-size:.86rem;color:var(--text-3);margin-top:-.4rem}
.vb-rec ul{list-style:none;padding:0;margin:0;display:grid;gap:.42rem}
.vb-rec li{display:flex;gap:.6rem;font-size:.93rem;color:var(--text-2);align-items:flex-start}
.vb-rec li .ti{width:20px;height:20px;font-size:.7rem}
.vb-rec .ft{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;padding:.8rem 1.3rem;background:var(--bg);border-top:1px solid var(--border)}
.vb-rec .ft .amps{display:flex;gap:1.1rem;flex-wrap:wrap;align-items:center}
.vb-tip{background:var(--gelb-soft);border-radius:14px;padding:.85rem 1.1rem;font-size:.92rem;margin-top:1rem}
.vb-cmp{margin-top:1rem;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow-x:auto}
.vb-cmp table{border-collapse:collapse;width:100%;font-size:.87rem;min-width:560px}
.vb-cmp th,.vb-cmp td{padding:.6rem .85rem;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
.vb-cmp thead th{font-family:var(--serif);font-weight:500;font-size:.98rem;background:var(--bg)}
.vb-cmp tbody th{font-weight:500;color:var(--text-3);width:24%;font-size:.82rem}
.vb-cmp tr:last-child td,.vb-cmp tr:last-child th{border-bottom:0}
.vb-us{margin-top:.9rem;display:grid;gap:.5rem}
.vb-us button{display:grid;grid-template-columns:1fr auto;gap:.2rem 1rem;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:.75rem 1rem;cursor:pointer}
.vb-us button:hover{border-color:var(--border-strong)}
.vb-us .nm{font-weight:500}
.vb-us .vd{grid-column:1/-1;font-size:.84rem;color:var(--text-2)}
.vb-list{margin-top:.9rem;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface)}
.vb-list button{display:grid;grid-template-columns:1fr auto;gap:.3rem 1rem;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--border);padding:.8rem 1.1rem;cursor:pointer;align-items:center}
.vb-list button:first-child{border-top:0}
.vb-list button:hover{background:var(--bg)}
.vb-list .nm{font-weight:500;display:block}
.vb-list .an{font-size:.8rem;color:var(--text-3)}
.vb-list .rt{display:flex;flex-direction:column;align-items:flex-end;gap:.3rem}
.vb-comp{position:fixed;left:0;right:0;bottom:0;padding:0 20px 1rem;background:linear-gradient(transparent,var(--bg) 35%);z-index:20}
.vb-comp-in{max-width:760px;margin:0 auto;position:relative}
.vb-box{background:var(--surface);border:1px solid var(--border-strong);border-radius:20px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:.5rem;padding:.55rem .55rem .55rem 1.1rem}
.vb-box input{flex:1;border:0;background:none;font:inherit;font-size:1rem;color:var(--text);outline:none;padding:.45rem 0;min-width:0}
.vb-box .send{width:36px;height:36px;border-radius:11px;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.vb-sugg{position:absolute;bottom:calc(100% + .4rem);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);max-height:50vh;overflow-y:auto}
.vb-sugg button{display:flex;justify-content:space-between;align-items:center;gap:1rem;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--border);padding:.65rem 1rem;cursor:pointer;font-size:.92rem}
.vb-sugg button:first-child{border-top:0}
.vb-sugg button:hover{background:var(--bg)}
.vb-note{text-align:center;font-size:.75rem;color:var(--text-3);margin-top:.45rem}

/* ============================================================
   C – Verzeichnis
   ============================================================ */
.vc-top{background:var(--bg);border-bottom:1px solid var(--border)}
.vc-top-in{max-width:1320px;margin:0 auto;padding:.75rem 20px;display:flex;align-items:center;gap:1.25rem}
.vc-search{flex:1;max-width:560px;display:flex;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;padding:0 .85rem}
.vc-search svg{width:17px;height:17px;color:var(--text-3)}
.vc-search input{border:0;background:none;font:inherit;font-size:.95rem;color:var(--text);padding:.6rem 0;width:100%;outline:none}
.vc-wrap{max-width:1320px;margin:0 auto;padding:2rem 20px 4rem}
.vc-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:2.5rem;align-items:end;margin-bottom:1.75rem}
.vc-hero h1{font-size:clamp(1.8rem,3.6vw,2.6rem);margin:0 0 .4rem}
.vc-hero p{color:var(--text-2);margin:0;font-size:1.03rem}
.vc-dist h3{font-family:var(--sans);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);font-weight:600;margin:0 0 .5rem;display:flex;justify-content:space-between}
.vc-bar{display:flex;height:46px;border-radius:12px;overflow:hidden;gap:3px}
.vc-bar button{border:0;cursor:pointer;color:#fff;font:600 .95rem var(--sans);display:flex;align-items:center;justify-content:center;transition:filter .15s,opacity .15s;min-width:34px}
.vc-bar button:hover{filter:brightness(1.08)}
.vc-bar.sel button{opacity:.35}
.vc-bar.sel button[aria-pressed="true"]{opacity:1}

function filtern(s){
  const q=(s.q||"").trim().toLowerCase().split(/\s+/).filter(Boolean);
  const out=TOOLS.filter(t=>{
    if(s.ort==="ch"&&t.dh!=="ch")return false;
    if(s.ort==="eu"&&!["ch","eu"].includes(t.dh))return false;
    if(s.orte&&s.orte.length&&!s.orte.some(o=>o==="rest"?["unklar","us","cn"].includes(t.dh):t.dh===o))return false;
    if(s.sens==="pd"&&!["gruen","gelb"].includes(t.pd.k))return false;
    if(s.sens==="bg"&&!["gruen","gelb"].includes(t.bg.k))return false;
    if(s.bed==="chat"&&!(t.fk.has("chat")&&["assistent","plattform","branche"].includes(t.zeile)))return false;
    if(s.bed==="wissen"&&!t.fk.has("wissen"))return false;
    if(s.bed==="spezial"&&!(t.zeile==="spezial"||t.fk.has("uebers")||t.fk.has("sprache")||t.fk.has("ocr")))return false;
    if(s.bed==="api"&&!(t.fk.has("api")&&["api","bausteine"].includes(t.zeile)))return false;
    if(s.bed==="onprem"&&!t.onprem)return false;
    if(s.funk&&s.funk.length&&!s.funk.every(f=>t.fk.has(f)))return false;
    if(s.cloud&&!t.cloudNein)return false;
    if(s.vischer&&!t.vischer)return false;
    if(q.length&&!q.every(w=>t.such.includes(w)))return false;
    return true;});
  const rel=s.sens==="bg"?"bg":"pd";
  out.sort((a,b)=>a[rel].r-b[rel].r||DH[a.dh].rang-DH[b.dh].rang||ZRANG[a.zeile]-ZRANG[b.zeile]||a.pp-b.pp||a.name.localeCompare(b.name));
  return out;
}

function bTop(){return `<div class="vb-top"><a class="brand" href="#" data-b="restart"><span class="brand-m">${SHIELD(16)}</span><b>KI</b>-Grenzgänger</a><button class="btn btn-t" data-b="restart">↺ Neu beginnen</button></div>`;}
function renderB(){
  const el=document.getElementById("vb");
  if(B.detail){ el.innerHTML=`${bTop()}<main class="vb-main"><button class="btn btn-t" data-b="back" style="margin-bottom:1rem">← Zurück zu ${B.step>=3?"den Empfehlungen":"den Fragen"}</button>${detailHTML(BY[B.detail])}</main>${bComposer()}`; return; }
  let h=`<section class="vb-welcome"><div class="logo">${SHIELD(26)}</div><h1>Welche KI passt zu Ihren Daten?</h1>
    <p>Drei kurze Fragen – danach empfehle ich Ihnen passende Tools und erkläre, worauf Sie achten müssen.</p>
    <div class="vb-trust"><span>${IC.check}${TOOLS.length} Tools geprüft</span><span>${IC.check}Unabhängig, ohne Werbung</span><span>${IC.check}Stand ${STAND}</span></div></section>`;
  B_Q.forEach((q,i)=>{
    if(i>B.step)return;
    const prog=`<div class="prog">${B_Q.map((_,j)=>`<i class="${j<=i?"on":""}"></i>`).join("")}<span>Frage ${i+1} von ${B_Q.length}</span></div>`;
    h+=`<div class="msg ${B.anim&&i===B.step?"neu":""}">${bAv}<div class="bd">${prog}<div class="tx">${q.t}${q.h?`<small>${q.h}</small>`:""}</div>`;
    if(i===B.step){
      h+=`<div class="vb-opts ${q.g2?"g2":""}">${q.o.map(([v,ic,l,s])=>{
        const n=filtern({...B.ans,[q.k]:v}).length;
        return `<button data-b="ans" data-k="${q.k}" data-v="${v}" data-i="${i}" ${n===0?"disabled style='opacity:.5'":""}><span class="ic">${ic}</span><span class="tt"><strong>${l}</strong><small>${s}</small></span><span class="n">${n} Tools</span></button>`;}).join("")}</div>`;}
    h+=`</div></div>`;
    if(i<B.step){const o=q.o.find(x=>x[0]===B.ans[q.k]);
      h+=`<div class="msg user"><button class="bub" data-b="edit" data-i="${i}" title="Antwort ändern">${o[1]}${o[2]}<small>ändern</small></button></div>`;}
  });
  if(B.step>=B_Q.length)h+=bResult();
  if(B.anim&&B.step>=B_Q.length)h=h.replace(/<div class="msg">(?=<div class="av">[\s\S]*?habe ich)/,'<div class="msg neu">');
  el.innerHTML=`${bTop()}<main class="vb-main">${h}</main>${bComposer()}`;
  B.anim=false;
}
function bGruende(t){const gut=t.kurz.filter(k=>k.ton==="gut").slice(0,3),achtung=t.kurz.find(k=>k.ton==="mittel"||k.ton==="schlecht");return[...gut,...(achtung?[achtung]:[])].slice(0,4);}
function bResult(){
  const s={...B.ans},list=filtern(s),recs=list.slice(0,3),rest=list.slice(3);
  const sens={"":"allgemeine Infos",pd:"Kunden- und Personendaten",bg:"Daten unter Berufsgeheimnis"}[s.sens];
  const ort={ch:"in der Schweiz",eu:"in Europa"}[s.ort];
  const rel=s.sens==="bg"?"bg":"pd";
  if(!list.length)return `<div class="msg">${bAv}<div class="bd"><div class="tx">Für diese Kombination habe ich leider kein passendes Tool gefunden. Versuchen Sie, Ihre Daten in Europa statt nur in der Schweiz zu halten – dort ist die Auswahl deutlich grösser.</div></div></div>`;
  let h=`<div class="msg">${bAv}<div class="bd">
    <div class="tx">Für ${sens}${ort?`, mit Daten ${ort},`:""} habe ich <b>${list.length} ${list.length===1?"passendes Tool":"passende Tools"}</b> gefunden. ${recs.length===1?"Das ist meine Empfehlung:":recs.length===3?"Das sind meine drei Empfehlungen:":"Das sind meine Empfehlungen:"}</div>
    <div class="vb-recs">${recs.map((t,i)=>`<div class="vb-rec"><div class="top">
      <div class="hd">${katHTML(t)}${t.vischer?'<span class="chip chip-v">VISCHER-geprüft</span>':""}<span class="rank"><b>${i+1}</b>Empfehlung</span></div>
      <h3>${esc(t.name)}</h3><div class="an"><span class="reg">${esc(t.reg)}</span> ${esc(t.anb)}</div>
      ${kannHTML(t)}
      <ul>${bGruende(t).map(k=>`<li class="ton-${k.ton}"><span class="ti">${tiIcon(k.ton)}</span><span>${esc(k.text)}</span></li>`).join("")}</ul></div>
      <div class="ft"><div class="amps">${ortKurz(t)}${ampHTML(t.pd,"Personendaten: ")}${ampHTML(t.bg,"Berufsgeheimnis: ")}</div><button class="btn btn-g" data-b="open" data-id="${t.id}">Steckbrief ansehen →</button></div>
    </div>`).join("")}</div>
    ${recs.length>1?`<div class="vb-cmp"><table><thead><tr><th></th>${recs.map(t=>`<th>${esc(t.kurzname)}</th>`).join("")}</tr></thead><tbody>
      <tr><th>Art</th>${recs.map(t=>`<td>${esc(t.kat.l)}</td>`).join("")}</tr>
      <tr><th>Datenort</th>${recs.map(t=>`<td>${ortKurz(t)}</td>`).join("")}</tr>
      <tr><th>Personendaten</th>${recs.map(t=>`<td>${ampHTML(t.pd)}</td>`).join("")}</tr>
      <tr><th>Berufsgeheimnis</th>${recs.map(t=>`<td>${ampHTML(t.bg)}</td>`).join("")}</tr>
      <tr><th>US-Zugriff (CLOUD Act)</th>${recs.map(t=>`<td>${t.cloudNein?"Nein":jn(t.r.us_cloud_act)==="ja"?"Möglich":"Offen"}</td>`).join("")}</tr>
      <tr><th>Preis</th>${recs.map(t=>`<td>${esc(t.r.preis||"–")}</td>`).join("")}</tr></tbody></table></div>`:""}
    ${s.sens==="bg"?'<div class="vb-tip"><b>Mein Hinweis:</b> Bei Berufsgeheimnissen braucht es fast immer eine Zusatzvereinbarung mit dem Anbieter, und die Websuche sollte ausgeschaltet sein.</div>':s.sens==="pd"?'<div class="vb-tip"><b>Mein Hinweis:</b> Schliessen Sie mit dem Anbieter einen Auftragsverarbeitungsvertrag (AVV) ab und verwenden Sie nie die Gratis-Version für Kundendaten.</div>':""}
  </div></div>`;
  const pop=POPULAER.map(id=>BY[id]).filter(t=>t&&!recs.includes(t)&&(["","chat","wissen"].includes(s.bed??"")||(s.bed==="spezial"&&t.fk.has("uebers"))));
  if(pop.length&&s.bed!=="api"&&s.bed!=="onprem"){
    h+=`<div class="msg">${bAv}<div class="bd"><div class="tx">Und was ist mit ChatGPT, Copilot &amp; Co.?<small>So schneiden die bekannten Tools für ${sens} ab:</small></div>
      <div class="vb-us">${pop.map(t=>`<button data-b="open" data-id="${t.id}"><span><span class="nm">${esc(t.name)}</span> <span class="muted klein">· ${esc(DH[t.dh].label)}</span></span>${ampHTML(t[rel])}<span class="vd">${esc(AMP_SATZ[rel][t[rel].k])}</span></button>`).join("")}</div></div></div>`;
  }
  if(rest.length)h+=`<div class="msg">${bAv}<div class="bd"><div class="tx">${B.alle?`Alle weiteren ${rest.length} passenden Tools, nach Eignung sortiert:`:`Es gibt noch ${rest.length} weitere passende Tools.`}</div>
    ${B.alle?`<div class="vb-list">${rest.map(t=>`<button data-b="open" data-id="${t.id}"><span><span class="nm">${esc(t.name)}</span><span class="an">${esc(t.kat.l)} · ${esc(t.anb)}</span></span><span class="rt">${ortKurz(t)}${ampHTML(t[rel])}</span></button>`).join("")}</div>`
      :`<div style="margin-top:.6rem"><button class="btn btn-g" data-b="alle">Alle ${rest.length} anzeigen</button></div>`}</div></div>`;
  return h;
}
function bComposer(){
  const q=B.q.trim().toLowerCase(),hits=q?TOOLS.filter(t=>t.such.includes(q)).slice(0,8):[];
  return `<div class="vb-comp"><div class="vb-comp-in">
    ${hits.length?`<div class="vb-sugg">${hits.map(t=>`<button data-b="open" data-id="${t.id}"><span>${esc(t.name)} <span class="muted klein">· ${esc(t.kat.l)}</span></span>${ortKurz(t)}</button>`).join("")}</div>`:""}
    <div class="vb-box"><input id="b-q" placeholder="Kennen Sie schon ein Tool? Name eingeben, z.B. «Copilot» oder «Mistral»" value="${esc(B.q)}" autocomplete="off"><button class="send" aria-label="Suchen" data-b="send">↑</button></div>
    <div class="vb-note">Redaktionelle Einschätzung, keine Rechtsberatung · Datenstand ${STAND}</div></div></div>`;
}
document.getElementById("vb").addEventListener("click",e=>{
  const b=e.target.closest("[data-b]");if(!b||b.disabled)return;e.preventDefault();const a=b.dataset.b;
  if(a==="ans"){B.ans[b.dataset.k]=b.dataset.v;B.step=+b.dataset.i+1;for(const q of B_Q.slice(B.step))delete B.ans[q.k];B.alle=false;B.anim=true;renderB();
    setTimeout(()=>{const m=[...document.querySelectorAll("#vb .msg:not(.user)")].pop();m&&m.scrollIntoView({behavior:"smooth",block:"start"});},30);}
  else if(a==="edit"){B.step=+b.dataset.i;renderB();}
  else if(a==="restart"){Object.assign(B,{ans:{},step:0,detail:null,alle:false,q:""});renderB();scrollTo(0,0);}
  else if(a==="open"){B.y=scrollY;B.detail=b.dataset.id;B.q="";renderB();scrollTo(0,0);}
  else if(a==="back"){B.detail=null;renderB();scrollTo(0,B.y||0);}
  else if(a==="alle"){B.alle=true;renderB();}
  else if(a==="send"){const t=TOOLS.find(t=>t.such.includes(B.q.trim().toLowerCase()));if(t&&B.q.trim()){B.y=scrollY;B.detail=t.id;B.q="";renderB();scrollTo(0,0);}}
});
document.getElementById("vb").addEventListener("input",e=>{if(e.target.id!=="b-q")return;B.q=e.target.value;renderB();const i=document.getElementById("b-q");i.focus();i.setSelectionRange(i.value.length,i.value.length);});
document.getElementById("vb").addEventListener("keydown",e=>{if(e.target.id==="b-q"&&e.key==="Enter")document.querySelector('#vb [data-b="send"]').click();});

const C={orte:[],sens:"",funk:[],q:"",cloud:false,vischer:false,ansicht:"karten",sort:""};
const C_DIST=[["ch","Schweiz",ZAHL.ch],["eu","Europa",ZAHL.eu],["eub","EU mit Ausnahmen",ZAHL.eub],["rest","USA, China, unklar",ZAHL.us+ZAHL.cn+ZAHL.unklar]];
const C_FUNK=["chat","wissen","agent","office","api","router","vektor","embed","uebers","sprache","ocr","gpu","onprem"];
function cListe(){const l=filtern(C);
  if(C.sort==="name")l.sort((a,b)=>a.name.localeCompare(b.name));
  if(C.sort==="ort")l.sort((a,b)=>DH[a.dh].rang-DH[b.dh].rang||a.pd.r-b.pd.r);
  if(C.sort==="pd")l.sort((a,b)=>a.pd.r-b.pd.r||DH[a.dh].rang-DH[b.dh].rang);
  if(C.sort==="bg")l.sort((a,b)=>a.bg.r-b.bg.r||DH[a.dh].rang-DH[b.dh].rang);
  return l;}
function cKarte(t){return `<button class="vc-card" data-c="open" data-id="${t.id}"><div class="in">
  <div class="hd">${katHTML(t)}${t.vischer?'<span class="chip chip-v">VISCHER</span>':""}</div>
  <h4>${esc(t.name)}</h4><div class="an"><span class="reg">${esc(t.reg)}</span>${esc(t.anb)}</div>
  <p class="ds">${esc(t.r.subkategorie)}</p>${kannHTML(t,3)}</div>${profilHTML(t)}</button>`;}

    res=gruppen.map(({z,tools})=>`<section class="vc-grp"><div class="vc-gh"><span class="ki">${IC[z.ic]}</span><div><h3>${z.l}</h3><p>${z.s}</p></div><span class="n">${tools.length} ${tools.length===1?"Tool":"Tools"}</span></div>

const vc=document.getElementById("vc");
vc.addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(!b||b.disabled)return;const a=b.dataset.c,k=b.dataset.k;
  if(a==="open"){oeffne(b.dataset.id);return;}
  if(a==="ort")C.orte=C.orte.includes(k)?C.orte.filter(x=>x!==k):[...C.orte,k];
  else if(a==="sens")C.sens=k;
  else if(a==="funk")C.funk=C.funk.includes(k)?C.funk.filter(x=>x!==k):[...C.funk,k];
  else if(a==="cloud")C.cloud=!C.cloud;
  else if(a==="vischer")C.vischer=!C.vischer;
  else if(a==="ansicht")C.ansicht=k;
  else if(a==="sort")C.sort=C.sort===k?"":k;
  else if(a==="reset")Object.assign(C,{orte:[],sens:"",funk:[],q:"",cloud:false,vischer:false});
  else return;
  e.preventDefault();const y=scrollY;renderC();scrollTo(0,y);});
vc.addEventListener("change",e=>{if(e.target.id==="c-sort"){C.sort=e.target.value;renderC();}});
let cT;vc.addEventListener("input",e=>{if(e.target.id!=="c-q")return;clearTimeout(cT);

      <label class="vd-find">${IC.search}<span class="sr">Tool finden</span><input id="d-q" type="search" placeholder="Tool finden, z.B. Copilot" value="${esc(D.q)}"></label>
    </div>
    <div class="vd-leg">${["gruen","gelb","orange","rot","offen"].map(k=>`<span class="amp amp-${k}"><i></i>${AMP[k].l}</span>`).join("")}${q?`<span><b>${treffer}</b> Treffer für «${esc(D.q)}»</span>`:""}</div>
    ${map}
    <p class="vd-note">Grün hinterlegt: Spalten, in denen Ihre Daten in der Schweiz oder in Europa bleiben können.</p>
    <div class="vd-insights">
      <div class="vd-ins"><b>${ZAHL.ch} Tools mit Daten in der Schweiz</b><p>Davon ${gutCH} für Personendaten geeignet. Fast alle setzen auf offene Modelle wie Mistral, Qwen oder Apertus.</p></div>
      <div class="vd-ins"><b>GPT, Claude &amp; Gemini nur via Europa</b><p>Die bekannten US-Modelle gibt es höchstens mit Datenhaltung in Europa (${frontierEU} Angebote) – praktisch nie nur in der Schweiz.</p></div>
      <div class="vd-ins"><b>Gratis-Versionen sind tabu</b><p>ChatGPT Free, Claude Free, Copilot und Gemini für Privatkunden sind für Firmendaten ungeeignet.</p></div>
    </div>
  </div>`;
}
const vd=document.getElementById("vd");
vd.addEventListener("click",e=>{const b=e.target.closest("[data-d]");if(!b)return;const a=b.dataset.d;
  if(a==="open"){oeffne(b.dataset.id);return;}
  if(a==="nach")D.nach=b.dataset.k; else if(a==="gut")D.nurGut=!D.nurGut; else return;
  const y=scrollY;renderD();scrollTo(0,y);});
let dT;vd.addEventListener("input",e=>{if(e.target.id!=="d-q")return;clearTimeout(dT);
  dT=setTimeout(()=>{D.q=e.target.value;renderD();const i=document.getElementById("d-q");i.focus();i.setSelectionRange(i.value.length,i.value.length);
    const h=vd.querySelector(".pill.hit");h&&h.scrollIntoView({block:"center",behavior:"smooth"});},250);});

/* ============================================================
   Umschalter
   ============================================================ */
const DESC={
  b:"Berater: drei Fragen wie im Gespräch, danach drei begründete Empfehlungen, Vergleich und «ChatGPT & Co.».",
  c:"Verzeichnis: Datenort-Leiste, Filter nach Funktionen, Karten nach Kategorie gruppiert – oder als Liste.",
  d:"Marktlandkarte: alle Tools in einer Matrix aus Bedarf × Datenort, eingefärbt nach Eignung.",
};
function zeige(v){
  schliesse();
  for(const x of["b","c","d"])document.getElementById("v"+x).hidden=x!==v;
  document.querySelectorAll(".sw-tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));
  document.getElementById("sw-desc").textContent=DESC[v];
  ({b:renderB,c:renderC,d:renderD})[v]();
  try{localStorage.setItem("ki-design2",v);}catch(_){}
  scrollTo(0,0);
}
document.querySelector(".sw-tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)zeige(b.dataset.v);});
document.addEventListener("keydown",e=>{if(e.target.matches("input,select,textarea"))return;const m={"1":"b","2":"c","3":"d"}[e.key];if(m)zeige(m);});
const root=document.documentElement;
function setTheme(t){root.dataset.theme=t;try{localStorage.setItem("ki-theme",t);}catch(_){}}
document.getElementById("sw-theme").addEventListener("click",()=>setTheme(root.dataset.theme==="dark"?"light":"dark"));
let gespeichert=null,thema=null;try{gespeichert=localStorage.getItem("ki-design2");thema=localStorage.getItem("ki-theme");}catch(_){}
setTheme(thema||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
// Direktlinks: #b, #c, #d – optional mit Zustand: #b/pd/eu/chat · #c/liste · #c/f/wissen/agent · #c/open/<id> · #d/bg · #d/open/<id>
const [hv,...hp]=location.hash.slice(1).split("/");
if(hv==="b"&&hp.length>=3){B.ans={sens:hp[0],ort:hp[1],bed:hp[2]};B.step=3;}
if(hv==="c"&&hp[0]==="liste")C.ansicht="liste";
if(hv==="c"&&hp[0]==="f")C.funk=hp.slice(1);
if(hv==="d"&&hp[0]==="bg")D.nach="bg";
zeige(["b","c","d"].includes(hv)?hv:["b","c","d"].includes(gespeichert)?gespeichert:"b");
if((hv==="c"||hv==="d")&&hp[0]==="open")oeffne(hp[1]);
</script>
