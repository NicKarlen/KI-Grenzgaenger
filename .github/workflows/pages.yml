# Baut die statische Website bei jedem Push auf main und veröffentlicht sie auf GitHub Pages.
# Einmalig in GitHub einstellen: Settings → Pages → Source: «GitHub Actions».
name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: pages
        uses: actions/configure-pages@v5
      - name: Daten prüfen und Website bauen
        run: python build.py
        env:
          # Öffentliche Adresse (für die LinkedIn-Vorschau) und Repo (für «Fehler melden» als GitHub-Issue).
          # Bei eigener Domain hier fest eintragen, z.B. GRENZGAENGER_SITE_URL: https://ki-grenzgaenger.ch/
          GRENZGAENGER_SITE_URL: ${{ steps.pages.outputs.base_url }}
          GRENZGAENGER_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
